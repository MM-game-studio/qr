<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR code maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{
font-family:tahoma,sans-serif;
background:#f5f5f5;
padding:20px;
text-align:center;
min-height:100vh;
position:relative;
}
.container{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}
input,select,textarea,button{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}
textarea{height:120px;}
.generate{background:#007bff;color:white;border:none;}
.download{background:#28a745;color:white;border:none;}
.download:disabled{background:#999;}
#qrcode{margin-top:20px;display:flex;justify-content:center;}
.footer{
position:fixed;
bottom:8px;
right:10px;
font-size:10px;
color:#777;
}
</style>
</head>
<body>

<div class="container">
<h2>QR code maker</h2>

<select id="mode" onchange="changeMode()">
<option value="wifi">WiFi</option>
<option value="text">Text</option>
</select>

<div id="wifiFields">
<input type="text" id="ssid" placeholder="نام وای‌فای (SSID)">
<input type="text" id="password" placeholder="رمز عبور">
</div>

<div id="textFields" style="display:none;">
<textarea id="textInput" placeholder="متن مورد نظر را وارد کنید"></textarea>
</div>

<button class="generate" onclick="generateQR()">تبدیل به QR</button>

<div id="qrcode"></div>

<button id="downloadBtn" class="download" onclick="downloadQR()" disabled>دانلود QR</button>
</div>

<div class="footer">Developed by Mehrad</div>

<script>
function changeMode(){
const mode=document.getElementById('mode').value;
document.getElementById('wifiFields').style.display=mode==='wifi'?'block':'none';
document.getElementById('textFields').style.display=mode==='text'?'block':'none';
}

function generateQR(){
const mode=document.getElementById('mode').value;
let qrData='';

if(mode==='wifi'){
const ssid=document.getElementById('ssid').value.trim();
const password=document.getElementById('password').value.trim();
if(!ssid){alert('نام وای‌فای را وارد کنید.');return;}
qrData=`WIFI:T:WPA;S:${ssid};P:${password};;`;
}else{
const text=document.getElementById('textInput').value.trim();
if(!text){alert('متن را وارد کنید.');return;}
qrData=text;
}

const qr=document.getElementById('qrcode');
qr.innerHTML='';

new QRCode(qr,{text:qrData,width:250,height:250});
document.getElementById('downloadBtn').disabled=false;
}

function downloadQR(){
const canvas=document.querySelector('#qrcode canvas');

if(canvas){
const url=canvas.toDataURL('image/png');
const a=document.createElement('a');
a.href=url;
a.download='qr-code.png';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
return;
}

const img=document.querySelector('#qrcode img');
if(img){
window.open(img.src,'_blank');
}
}
</script>

</body>
</html>
